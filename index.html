<!DOCTYPE html>
<html>
<head>
<title>Happy Valentine's Day ❤️</title>
<style>
body {
  text-align: center;
  font-family: Arial;
  background: linear-gradient(to right, #ff9a9e, #fad0c4);
  color: white;
}
button {
  padding: 10px 20px;
  font-size: 18px;
  border: none;
  background: red;
  color: white;
  border-radius: 20px;
  cursor: pointer;
}
</style>
</head>
<body>

<h1>Happy Valentine's Day ❤️</h1>
<p>You are the best thing that ever happened to me.</p>

<button onclick="showMessage()">Click for Surprise 💌</button>

<p id="hidden" style="display:none;">I love you forever ♾️</p>

<script>
function showMessage() {
  document.getElementById("hidden").style.display = "block";
}
</script>

</body>
</html>

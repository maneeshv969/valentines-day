<!DOCTYPE html>
<html>
<head>
<title>Happy Valentine's Day ❤️</title>

<style>
body {
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#ff4e8a,#ff9ecf);
  color:white;
  text-align:center;
  overflow-x:hidden;
}

/* NAVBAR */
nav{
  position:fixed;
  top:0;
  width:100%;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(10px);
  padding:15px;
}

nav a{
  margin:15px;
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.container{
  margin-top:120px;
  padding:20px;
}

.glass{
  background:rgba(255,255,255,0.15);
  padding:30px;
  border-radius:20px;
  backdrop-filter:blur(10px);
  max-width:700px;
  margin:auto;
}

button{
  padding:15px 30px;
  border:none;
  border-radius:40px;
  font-size:18px;
  cursor:pointer;
  background:white;
  color:#ff2d75;
  transition:0.3s;
}

button:hover{
  transform:scale(1.1);
}

.heart{
  position:fixed;
  animation:float 6s linear infinite;
}

@keyframes float{
  0%{transform:translateY(100vh);opacity:1;}
  100%{transform:translateY(-10vh);opacity:0;}
}
</style>
</head>

<body>

<nav>
  <a href="index.html">Home</a>
  <a href="story.html">Story</a>
  <a href="gallery.html">Gallery</a>
  <a href="letter.html">Letter</a>
  <a href="memories.html">Memories</a>
  <a href="surprise.html">Surprise</a>
</nav>

<div class="container">
  <div class="glass">
    <h1>Happy Valentine's Day ❤️</h1>
    <p>You are my favorite chapter in this lifetime.</p>
    <button onclick="showLove()">Click Me 💖</button>
    <p id="message" style="display:none; font-size:22px;">
      I love you endlessly ♾️
    </p>
  </div>
</div>

<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9b3c17.mp3?filename=romantic-background-110769.mp3" type="audio/mpeg">
</audio>

<script>

/* Music on first interaction */
document.body.addEventListener("click",()=>{
  document.getElementById("bgMusic").play();
},{once:true});

function showLove(){
  document.getElementById("message").style.display="block";
}

/* Floating hearts */
setInterval(()=>{
  const heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="❤️";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=(Math.random()*25+15)+"px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),6000);
},500);

</script>

</body>
</html>
